name: Feature
description: Propose a change or addition
labels: [roadmap]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The user-facing problem or gap this addresses.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What to build, and roughly how.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
